name: ctrlcashapp
description: "CtrlCash - finanzas personales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.9.2
  get_it: ^9.2.1
  go_router: ^17.3.0
  equatable: ^2.0.8
  dartz: ^0.10.1
  intl: ^0.20.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0025"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/