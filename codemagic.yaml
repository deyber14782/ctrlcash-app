workflows:
  ios-ipa-sin-firma:
    name: CtrlCash iOS IPA sin firma
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias de Flutter
        script: |
          flutter pub get
      - name: Compilar iOS sin firma
        script: |
          flutter build ios --release --no-codesign
      - name: Crear el IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr CtrlCash.ipa Payload
    artifacts:
      - build/ios/ipa/CtrlCash.ipa